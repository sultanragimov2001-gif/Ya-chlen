name: yt-grab

on:
  push:
    branches: [claude/yt-visual-analysis]
    paths: [videos.txt, scripts/grab.sh, .github/workflows/yt-grab.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
          pip install -U yt-dlp
      - name: Grab videos
        run: bash scripts/grab.sh
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "Add extracted frames and metadata" || exit 0
          git push
